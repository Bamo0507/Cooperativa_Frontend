mutation ApproveOrRejectPayment($id: String!, $newState: String!, $commentary: String!) {
    approveOrRejectPayment(id: $id, newState: $newState, commentary: $commentary) {
        id
        name
        presentedByName
        paymentDate
        photoPath
        state
        ticketNum
        totalAmount
        accountNum
        commentary
        beingPayed {
            modelKey
            modelType
            amount
        }
    }
}