query GetMonthlyAffiliateQuota($accessToken: String!) {
    getMonthlyAffiliateQuota(accessToken: $accessToken) {
        amount
        expDate
        identifier
        isExtraordinary
        loanId
        montoPagado
        multa
        nombrePrestamo
        nombreUsuario
        payBy
        payed
        quotaNumber
        quotaType
        userId
    }
}
